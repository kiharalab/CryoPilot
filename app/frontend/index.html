<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="CryoPilot: agentic cryo-EM reconstruction and modeling" />
    <title>CryoPilot</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before the first paint.
      ;(function () {
        var choice = 'system'
        try {
          choice = localStorage.getItem('cryopilot-theme') || 'system'
        } catch (error) {}
        var dark = choice === 'dark' || (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <link rel="stylesheet" href="/molstar/molstar.css" />
    <script src="/molstar/molstar.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
